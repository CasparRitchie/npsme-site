<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Customer Experience (CX) Consulting & NPS Improvement | NPS Me</title>
    <meta name="description" content="NPS Me is a CX consulting firm helping teams improve Net Promoter Score (NPS)®, retention, and revenue—diagnose friction, prioritise fixes, ship measurable gains." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.npsme.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.npsme.com/" />
    <meta property="og:title" content="Customer Experience (CX) Consulting & NPS Improvement | NPS Me" />
    <meta property="og:description" content="Improve NPS®, retention, and revenue with pragmatic CX consulting—discover, prioritise, implement, and monitor what moves the needle." />
    <meta property="og:image" content="https://www.npsme.com/og-image.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://www.npsme.com/og-image.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="NPS Me" />
    <meta property="og:image:alt" content="NPS Me — Turn feedback into growth" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Customer Experience (CX) Consulting & NPS Improvement | NPS Me" />
    <meta name="twitter:description" content="Pragmatic CX consulting to lift NPS®, reduce churn, and grow revenue." />
    <meta name="twitter:image" content="https://www.npsme.com/og-image.jpg?v=3" />

    <meta name="theme-color" content="#0B0F19" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- JSON-LD -->
    <!-- Structured data: Organization + Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://www.npsme.com/#organization",
          "name": "NPS Me",
          "url": "https://www.npsme.com/",
          "description": "Customer experience (CX) consulting to improve NPS®, retention, and revenue.",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.npsme.com/#logo",
            "url": "https://www.npsme.com/favicon-512.png",
            "width": 512,
            "height": 512,
            "caption": "NPS Me logo"
          },
          "founder": {
            "@type": "Person",
            "name": "Caspar Ritchie",
            "sameAs": ["https://www.linkedin.com/in/casparritchie"]
          },
          "sameAs": [
            "https://www.linkedin.com/company/npsme"  /* update to your real company URL if different */
          ],
          "areaServed": ["GB","FR","EU"]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.npsme.com/#website",
          "url": "https://www.npsme.com/",
          "name": "NPS Me",
          "publisher": { "@id": "https://www.npsme.com/#organization" },
          "inLanguage": "en-GB"
        }
      ]
    }
    </script>
  </head>

  <body class="bg-[#0B0F19]">
