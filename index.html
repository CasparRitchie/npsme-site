<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Performance: preconnect critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Primary SEO -->
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical (server.js will replace this per-route) -->
    <link rel="canonical" href="https://www.npsme.com/" />

    <!-- Hreflang alternates (server.js will inject/replace this) -->
    __HREFLANG__

    <!-- Open Graph (server.js will replace og:url/og:title/og:description per-route) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.npsme.com/" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="https://www.npsme.com/og-image.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://www.npsme.com/og-image.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="NPS Me" />
    <meta property="og:image:alt" content="NPS Me - Turn feedback into growth" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="https://www.npsme.com/og-image.jpg?v=3" />

    <meta name="theme-color" content="#0B0F19" />
    <!-- Bing & Microsoft Rich Snippet Support -->
    <meta name="application-name" content="NPS Me" />
    <meta name="msapplication-TileColor" content="#0B0F19" />
    <meta name="msapplication-TileImage" content="https://www.npsme.com/favicon-192.png" />
    <meta name="msapplication-square150x150logo" content="https://www.npsme.com/favicon-192.png" />
    <meta name="msapplication-wide310x150logo" content="https://www.npsme.com/favicon-512.png" />
    <meta property="og:logo" content="https://www.npsme.com/favicon-512.png" />
    <meta name="msvalidate.01" content="9B0070D35C1F798962D52A8409CF7F3E" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- JSON-LD -->
    <!-- Structured data: Organization + Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://www.npsme.com/#organization",
            "name": "NPS Me",
            "url": "https://www.npsme.com/",
            "description": "Customer experience (CX) consulting to improve NPS®, retention, and revenue.",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://www.npsme.com/#logo",
              "url": "https://www.npsme.com/favicon-512.png",
              "width": 512,
              "height": 512,
              "caption": "NPS Me logo"
            },
            "image": "https://www.npsme.com/favicon-512.png",
            "founder": {
              "@type": "Person",
              "name": "Caspar Ritchie",
              "sameAs": ["https://www.linkedin.com/in/casparritchie"]
            },
            "sameAs": ["https://www.linkedin.com/company/npsme"],
            "areaServed": ["GB", "FR", "EU"]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.npsme.com/#website",
            "url": "https://www.npsme.com/",
            "name": "NPS Me",
            "publisher": { "@id": "https://www.npsme.com/#organization" },
            "inLanguage": "__INLANG__"
          }
        ]
      }
    </script>
  </head>

  <body class="bg-[#0B0F19]">
    <div id="root"></div>
    <!-- Dev entry; Vite rewrites this to /assets/*.js in dist for prod -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
