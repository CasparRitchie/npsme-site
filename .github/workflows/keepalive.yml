name: Keep Heroku dyno warm

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl healthcheck
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" https://www.npsme.com/healthz
