<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <mask id="cutout">
      <rect width="512" height="512" fill="white"/>
      <!-- Top line -->
      <text x="50%" y="44%" text-anchor="middle"
            font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-weight="900" font-size="190" fill="black" dominant-baseline="middle">
        NPS
      </text>
      <!-- Bottom line -->
      <text x="50%" y="68%" text-anchor="middle"
            font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-weight="800" font-size="150" fill="black" dominant-baseline="middle">
        Me
      </text>
    </mask>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#grad)" mask="url(#cutout)"/>
</svg>
